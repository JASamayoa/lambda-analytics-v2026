  :root {
    --navy:        #163b59;
    --navy-deep:   #0d2538;
    --navy-ink:    #081826;
    --gold:        #ffb530;
    --gold-soft:   #f0c875;
    --paper:       #faf6ee;
    --paper-warm:  #f4ede2;
    --ink:         #0f1d2c;
    --muted:       #5a6f82;
    --line:        rgba(13,37,56,0.12);
    --line-strong: rgba(13,37,56,0.24);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  .serif { font-family: 'Fraunces', serif; font-optical-sizing: auto; }

  /* ---------- NAV ---------- */
  nav.top {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    padding: 18px clamp(20px, 5vw, 64px);
    background: rgba(8, 24, 38, 0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(244,237,226,0.08);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .logo {
    text-decoration: none;
    display: inline-flex;
    flex-direction: column;
    align-items: flex-end;
    line-height: 1;
    gap: 3px;
  }
  .logo .wordmark {
    font-family: 'Pirulen', 'Inter', sans-serif;
    font-size: 22px;
    letter-spacing: 0.06em;
    color: var(--paper);
    font-weight: 400;
    line-height: 1;
  }
  .logo .descriptor {
    font-family: 'Pirulen', 'Inter', sans-serif;
    font-size: 10.5px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(244,237,226,0.85);
    font-weight: 400;
    line-height: 1;
  }
  .nav-links {
    display: flex;
    gap: 32px;
    align-items: center;
  }
  .nav-links a {
    color: rgba(244,237,226,0.75);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    transition: color 0.2s;
  }
  .nav-links a:hover { color: var(--gold); }
  .nav-cta {
    background: var(--gold);
    color: var(--navy-ink) !important;
    padding: 9px 18px;
    border-radius: 999px;
    font-weight: 600 !important;
    font-size: 13px !important;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .nav-cta:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(255,181,48,0.3);
    color: var(--navy-ink) !important;
  }
  @media (max-width: 768px) {
    .nav-links a:not(.nav-cta) { display: none; }
  }

  /* ---------- HERO ---------- */
  .hero {
    min-height: 100vh;
    background: var(--navy-ink);
    color: var(--paper);
    position: relative;
